name: Port checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: python3 -m unittest discover -s tests -v
      - run: dotnet run --project tests/ImportTests -c Release
      - run: gcc -std=c11 -O2 -Wall -Wextra -Werror build/src/native/rg34xxsp_rumble.c -o /tmp/rg34xxsp-rumble && dotnet run --project tests/RumbleIntegration -c Release -- /tmp/rg34xxsp-rumble
      - run: dotnet build build/src/MainlineGameDataPatcher -c Release
      - run: bash -n portmaster_stardewvalley_mainline/StardewValleyMainline.sh
  package:
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash build/scripts/build-rg34xxsp.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stardew-rg34xxsp-knulli-experimental
          path: build/out/mainline/release/*
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=rg34xxsp-knulli-v0.1.0
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
              --title 'RG34XXSP KNULLI v0.1.0 — experimental' --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$tag" build/out/mainline/release/* --clobber
          gh release edit "$tag" --draft=false --prerelease --notes-file docs/RELEASE-NOTES.md
