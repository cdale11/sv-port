# Shell configuration, loaded by StardewValleyMainline.sh.
# auto: vanilla unless user mods are installed. Other values: vanilla, smapi.
SDV_LAUNCH_MODE=auto
# Built-in binary on/off motor. The game's own vibration option still applies.
SDV_RUMBLE=1
# Zero-based gamepad index receiving built-in rumble; leave 0 for internal pad.
SDV_RUMBLE_PLAYER=0
# Keep 0 for ordinary play; 1 preserves KNULLI's injected MangoHud overlay.
SDV_PERFORMANCE_OVERLAY=0
# Set 1 for a launch to rerun preparation even if the metadata cache matches.
SDV_FORCE_PREPARE=0
# Native panel fallback is 720x480. PortMaster/HDMI dimensions take precedence.
