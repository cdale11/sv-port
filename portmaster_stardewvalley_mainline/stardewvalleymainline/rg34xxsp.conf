# Shell configuration, loaded by StardewValleyMainline.sh.
# auto: vanilla unless user mods are installed. Other values: vanilla, smapi.
SDV_LAUNCH_MODE=auto
# Built-in binary on/off motor. The game's own vibration option still applies.
SDV_RUMBLE=1
# Zero-based gamepad index receiving built-in rumble; leave 0 for internal pad.
SDV_RUMBLE_PLAYER=0
# auto preserves KNULLI's selected battery/performance HUD; off disables it.
# SDV_PERFORMANCE_OVERLAY from v0.1.2 is superseded by this setting.
SDV_HUD=auto
# Make all online cores eligible for the game; inherit leaves CFW affinity alone.
SDV_CPU_AFFINITY=all
# Temporarily use performance governor; inherit leaves CFW policy alone.
SDV_CPU_GOVERNOR=performance
# Optimize frequently called farm/update code after warm-up.
SDV_TIERED_PGO=1
SDV_TIERED_COMPILATION=1
# Quick initial compilation of loop-containing methods; 0 restores .NET 6 default.
SDV_QUICKJIT_LOOPS=1
# 0 avoids GPU-wide stalls after same-context texture uploads; 1 is the fallback.
SDV_TEXTURE_UPLOAD_SYNC=0
# Initial sprite pool; larger farms can still grow it dynamically.
SDV_SPRITE_BATCH_CAPACITY=2048
# Lightweight managed/SDL/audio/initialization timing markers.
SDV_STARTUP_DIAGNOSTICS=1
# Set 1 for a launch to rerun preparation even if the metadata cache matches.
SDV_FORCE_PREPARE=0
# Native panel fallback is 720x480. PortMaster/HDMI dimensions take precedence.
